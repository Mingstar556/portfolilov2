<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — LGPSM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black font-sans min-h-screen flex items-center justify-center p-8">
    <div class="max-w-2xl w-full">
        <h1 class="text-4xl font-black mb-8 uppercase tracking-widest">Connect</h1>
        <form class="space-y-6">
            <div>
                <label class="block text-sm uppercase tracking-wider mb-2">Name</label>
                <input type="text" class="w-full border border-gray-300 p-3 focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-sm uppercase tracking-wider mb-2">Email</label>
                <input type="email" class="w-full border border-gray-300 p-3 focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-sm uppercase tracking-wider mb-2">Message</label>
                <textarea rows="5" class="w-full border border-gray-300 p-3 focus:outline-none focus:border-black"></textarea>
            </div>
            <button class="bg-black text-white px-8 py-3 uppercase tracking-widest hover:bg-gray-800 transition">Send Inquiry</button>
        </form>
    </div>
</body>
</html>
